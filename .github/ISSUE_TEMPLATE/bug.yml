name: 🐛 Bug 报告
description: 皮肤行为异常、显示问题、兼容性问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量填写完整，缺少环境信息或截图的报告会被直接打回。
  - type: dropdown
    id: skin
    attributes:
      label: 皮肤
      description: 问题出现在哪套皮肤
      options:
        - orca-link（虎鲸链路）
        - maid-atelier（深海女仆工坊）
        - 不确定 / 其他
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: 运行 `dsh --version` 的输出
      placeholder: 例如 0.1.0-rc.8
    validations:
      required: true
  - type: input
    id: skin-version
    attributes:
      label: 皮肤版本 / 提交
      description: 皮肤安装方式与来源（link 路径 / git 提交号），不确定就写"最新"
      placeholder: 例如 main 最新提交，或本地 link 路径
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: 浏览器
      options:
        - Chrome / Chromium
        - Edge
        - Safari / WebKit
        - Firefox
        - 桌面壳 / 其他
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: 浏览器版本 / 系统
      description: 例如 Chrome 140 / Windows 11；Safari 请写 macOS 版本
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: 主题模式
      options:
        - 浅色
        - 深色
        - 跟随系统
    validations:
      required: true
  - type: dropdown
    id: sidebar
    attributes:
      label: 侧栏状态
      options:
        - 宽侧栏
        - 窄侧栏（rail）
        - 两种都复现
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 发生了什么、期望是什么
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 1. … 2. … 3. …
      placeholder: 1. 打开设置面板\n2. 切换到「Agent 预设」\n3. …
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 截图 / 录屏
      description: 直接拖拽图片到此处。无法截图请明确说明原因，否则视为未完成报告
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: 控制台错误 / 日志
      description: 按 F12 打开开发者工具，Console 与 Network 中的相关报错（可选，但很有用）
      render: shell
    validations:
      required: false
  - type: textarea
    id: plugins
    attributes:
      label: 已安装的其他插件
      description: 皮肤与 dsh-better-sidebar / dsh-ui-appearance / dsh-tps 等同时使用时，请列出（很多问题来自插件组合）
    validations:
      required: false
