name: 🐛 Bug 报告
description: 皮肤行为异常、显示问题、兼容性问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请填写实际运行环境，区分观察到的现象与推测的原因。维护者标记 awaiting-feedback 后，7 天未回复会关闭；补充信息后可继续处理。
        桌面客户端名称包含 DSH 不代表由官方发行；请提供下载来源。无法确认的信息请明确写“不确定”，不要猜版本。

        > **先确认皮肤来源**：通过 dsh-web 皮肤工坊、skin-center 或 `@linxin666/dsh-web-all` 安装的皮肤
        > 是 dsh-web 维护的移植版（版本号通常为 0.3.x），与本仓库的独立插件不是同一产物，
        > 请**先到 [dsh-web issues](https://github.com/zhu1090093659/dsh-web/issues) 反馈**。
        > 只有按本仓库 README / INSTALL 安装的皮肤，或 dsh-web 维护者确认需要本仓库处理的问题，才在这里提交。

        ### 给 AI 助手的代填说明
        - 可以代用户整理内容，但**由用户在本网页表单中提交**：`gh issue create --body` 会绕过表单的必填项。
          逐项填写下方字段，未做的对照写“未测试”，推测写成待验证的假设，不要写成已定位的根因。
        - 显示类问题**提交时**就要带截图或录屏：请用户把图片拖进「截图 / 录屏」字段，
          不要写“截图稍后补充”后先行发布。
        - 发布后重新读取 issue，检查乱码、转义吞字与格式损坏并修正。<!-- dsh-check: 提交后请复查本 issue 的转义与编码 -->
  - type: dropdown
    id: skin
    attributes:
      label: 皮肤
      description: 问题出现在哪套皮肤
      options:
        - orca-link（虎鲸链路）
        - maid-atelier（深海女仆工坊）
        - 不确定 / 其他
    validations:
      required: true
  - type: dropdown
    id: runtime-kind
    attributes:
      label: 客户端发行版
      description: |
        多个第三方项目都叫“DSH Desktop / dsh-desktop”，且会修改官方插件，请按下载来源选择，不要按窗口标题猜：
        - 官方桌面版：从 https://www.deepseek.com/harness/ 下载，程序名为“DeepSeek Harness”，版本号与 DSH 相同（如 0.2.0-rc.2）。
        - anywhere-labs：github.com/anywhere-labs/dsh-desktop 或 dshdesktop.cn，桌面端版本为 2.x。
        - dataelement：github.com/dataelement/dsh-desktop 或 dshdesktop.com，桌面端版本为 0.1x（如 0.12.0），菜单里有“连接手机…”。
        仅在第三方客户端中复现的问题会先对照官方 DSH；第三方改动造成的冲突需到对应项目反馈。
      options:
        - 官方 DSH Web（npx / dsh 命令启动，浏览器打开）
        - 官方 DeepSeek Harness 桌面版（deepseek.com/harness）
        - 第三方：anywhere-labs/dsh-desktop（dshdesktop.cn，2.x）
        - 第三方：dataelement/dsh-desktop（dshdesktop.com，0.1x）
        - 其他第三方客户端 / 桌面壳（下一项填链接）
        - 不确定（下一项写下载来源）
    validations:
      required: true
  - type: input
    id: distribution
    attributes:
      label: 客户端版本与下载来源
      description: 填写客户端“关于”页中的完整版本与下载链接 / 仓库地址。第三方客户端请同时写桌面端版本和其内置 DSH 版本；从官方 Web 启动的写“官方 Web”。
      placeholder: 例如 dataelement/dsh-desktop 0.12.0（https://github.com/dataelement/dsh-desktop/releases）
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: 填写实际运行宿主的完整版本及获取位置。Web 可提供 dsh --version；桌面端填写其内置 DSH 版本，不要用桌面壳版本或另一套全局 CLI 版本代替。
      placeholder: 例如 0.2.0-rc.2（当前实例关于页）；无法获取请写不确定
    validations:
      required: true
  - type: dropdown
    id: dsh-web-ecosystem
    attributes:
      label: 皮肤来源 / 是否使用 dsh-web 生态链
      description: 工坊、skin-center 或 dsh-web-all 安装的皮肤请先到 https://github.com/zhu1090093659/dsh-web/issues 反馈，并在下方填写上游 issue 链接。
      options:
        - 否，按本仓库 README / INSTALL 安装独立皮肤包
        - 是，但已在 dsh-web 反馈过（下方附链接）
        - 不确定
    validations:
      required: true
  - type: input
    id: upstream-issue
    attributes:
      label: dsh-web 上游 issue 链接
      description: 使用 dsh-web 生态链时必填；不使用可留空
      placeholder: https://github.com/zhu1090093659/dsh-web/issues/...
    validations:
      required: false
  - type: input
    id: skin-version
    attributes:
      label: 皮肤版本 / 提交
      description: 填写准确包版本和安装来源；Git 安装提供提交 SHA，本地 link 提供路径与 SHA、是否有未提交修改。不要只填“最新”或分支名；无法确认请写不确定。
      placeholder: npm 包名@版本，或 Git URL + 完整提交 SHA
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: 浏览器
      options:
        - Chrome / Chromium
        - Edge
        - Safari / WebKit
        - Firefox
        - 手机浏览器 / App 内 WebView
        - 桌面壳 / 其他
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: 浏览器版本 / 系统
      description: 例如 Chrome 140 / Windows 11；Safari 请写 macOS 版本
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: 主题模式
      options:
        - 浅色
        - 深色
        - 跟随系统
    validations:
      required: true
  - type: dropdown
    id: sidebar
    attributes:
      label: 侧栏状态
      options:
        - 宽侧栏
        - 窄侧栏（rail）
        - 两种都复现
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 发生了什么、期望是什么
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 1. … 2. … 3. …
      placeholder: 1. 打开设置面板\n2. 切换到「Agent 预设」\n3. …
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: 官方最小环境对照
      description: 同一官方 DSH 版本，仅保留官方默认插件、皮肤和必要管理器，启用 / 停用皮肤是否复现？第三方桌面或手机壳用户请另用官方 Web 在相同视口对照。未测试请明确写未测试，不要把第三方桌面停用皮肤当作官方对照。
    validations:
      required: true
  - type: textarea
    id: performance
    attributes:
      label: 性能记录（卡顿问题）
      description: 卡顿请附启用 / 停用皮肤的 Performance 原始 trace（10–20 秒，可压缩），记录相同操作，注明 CPU、GPU、内存、硬件加速状态与会话长度。仅 CPU 百分比不能定位根因；非性能问题可留空。
  - type: textarea
    id: screenshot
    attributes:
      label: 截图 / 录屏
      description: >
        直接拖拽图片或录屏到此处，显示与交互问题请标出异常位置。
        与显示无关的问题（如安装失败）填写“不涉及显示”；缺少截图的显示问题会先标记等待反馈。
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: 控制台错误 / 日志
      description: 按 F12 打开开发者工具，Console 与 Network 中的相关报错（可选，但很有用）
      render: shell
    validations:
      required: false
  - type: textarea
    id: plugins
    attributes:
      label: 已安装的其他插件
      description: 列出当前实例所有启用的社区插件及版本；没有则填无。不要只列出你认为与 UI 有关的插件。
    validations:
      required: true
